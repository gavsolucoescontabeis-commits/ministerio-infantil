name: Homologação — cadastro da equipe
on:
  pull_request:
    paths:
      - 'cadastro-equipe/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/homologacao-cadastro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ferramentas de teste
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar cenários no navegador
        run: npm run test:e2e
      - name: Testar formulário realmente publicado, sem gravar dados
        env:
          FORM_URL: https://gavsolucoescontabeis-commits.github.io/ministerio-infantil/cadastro-equipe/
        run: npm run test:e2e
      - name: Guardar evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-homologacao-cadastro
          path: |
            playwright-report/
            test-results/
          retention-days: 7
